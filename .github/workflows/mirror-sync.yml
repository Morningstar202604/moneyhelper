name: mirror-sync
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gitcode
            url: https://gitcode.com/badhope/xiaoman.git
            secret: GITCODE_TOKEN
            user: badhope
          - name: gitee
            url: https://gitee.com/badhope/xiaoman.git
            secret: GITEE_TOKEN
            user: badhope
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push mirror to ${{ matrix.name }}
        run: |
          git remote add mirror "https://${{ matrix.user }}:${{ secrets[matrix.secret] }}@${{ matrix.url#https:// }}"
          git push mirror main --force
          git push mirror --tags --force
