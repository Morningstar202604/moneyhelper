[pytest]
asyncio_mode = auto
testpaths = tests
# 全局测试超时：任何测试最多跑 30s（防止依赖真实 LLM/行情/网络的测试无限挂起）。
# 离线/慢网下这些用例会快速失败而非卡死；联网机器上照常通过。
timeout = 30
markers =
    migration: 会切换全局 DB_PATH 的迁移测试（必须与其它用例串行）
    network: 需要真实 LLM / 行情 / 外网（离线时会超时失败，可加 --run-network 或联网跑）
filterwarnings =
    # 注意：ini 里的 message 是「正则前缀匹配」（pytest 以 escape=False 编译），
    # 这里都写成纯文本前缀即可；含 "()" 的消息不要照抄全串（空分组会失配）。
    # —— 第三方库的「待上游修复」弃用提示（均非本项目代码触发；升级依赖后再移除豁免）——
    # starlette TestClient 内部 anyio 别名（测试专用导入路径）
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
    # sse_starlette 内部 datetime.utcnow()（注意：消息只写到 utcnow 为止——
    # 后面的 "()" 在 ini（正则语义）下会变成空分组匹配不上，这里刻意不含括号）
    ignore:datetime.datetime.utcnow:DeprecationWarning
    # langgraph checkpoint 的 allowed_objects 默认值变更预告（框架内部）
    ignore:The default value of `allowed_objects` will change:langchain_core._api.deprecation.LangChainPendingDeprecationWarning
    # langgraph 1.x：create_react_agent / AgentStatePydantic 迁移预告（迁移目标在
    # langchain v1 主包，本项目未引入该依赖；待引入后按官方路径迁移）
    ignore:create_react_agent has been moved:langgraph.warnings.LangGraphDeprecatedSinceV10
    ignore:AgentStatePydantic has been moved:langgraph.warnings.LangGraphDeprecatedSinceV10
    # mem0 内部 pydantic v1 风格配置
    ignore:Support for class-based `config` is deprecated:DeprecationWarning
